<!DOCTYPE html>
<html>
  <template>
    <!-- 9.583-13.083 film. Host VO: Welcome .10 / to .60 / another .96 / episode 1.22 / of 1.70 / the 2.00 /

    <style>
      #root { position: absolute; inset: 0; overflow: hidden; --accent: var(--color-accent, #22D1C1); }

      #pod .pl { display: inline-block; opacity: 0; }

    <div id="root" data-composition-id="title" data-width="1920" data-height="1080">
      <div class="plate"></div>
      <div class="frame"></div>
      <div id="lock">
        <div id="welcome"><span class="w">Welcome</span> <span class="w">to</span> <span class="w">another</span> <span class="w">episode</span> <span class="w">of</span> <span class="w">the</span></div>

        <div id="ft">NEW EPISODE &middot; FT. SIMONE KNEGO</div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        [0.10, 0.60, 0.96, 1.22, 1.70, 2.00].forEach((t, i) => {
          tl.fromTo(`#welcome .w:nth-child(${i + 1})`, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, ease: 'power2.out' }, t);

        tl.fromTo('#res', { opacity: 0, scale: 1.35, filter: 'blur(14px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.24, ease: 'expo.out' }, 2.16);

        document.querySelectorAll('#pod .pl').forEach((p, i) => { tl.fromTo(p, { opacity: 0, x: (i - 3) * 26 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, 2.88); });
        tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power3.inOut' }, 2.92);
        tl.fromTo('#ft', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out' }, 3.05);
        // leave: the lockup punches toward camera and blurs out on the cut
        tl.fromTo('#lock', { scale: 1, opacity: 1 }, { scale: 1.12, opacity: 0, filter: 'blur(10px)', duration: 0.16, ease: 'power3.in', immediateRender: false }, 3.34);
        window.__timelines['title'] = tl;
      })();
