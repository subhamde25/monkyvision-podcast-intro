<!DOCTYPE html>
<html>
  <template>
    <!-- 75.75 film. The thesis line, built word by word on her voice while the camera pushes (index.html).
         Scene seconds: when .17 you .65 change .81 the 1.05 way 1.21 you 1.33 see 1.45 yourself 1.63 /
         the 2.11 world 2.19 around 2.39 you 2.73 changes 2.97 -->
    <style>
      #root { position: absolute; inset: 0; overflow: hidden; --accent: var(--color-accent, #22D1C1); }
      #dim { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(10,10,12,.5) 0%, rgba(10,10,12,.86) 100%); opacity: 0; }
      #txt { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
      .w { display: inline-block; opacity: 0; }
      #l1 { font-family: Inter, sans-serif; font-weight: 700; font-size: 56px; color: #fff; letter-spacing: -0.01em; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
      #l2 { margin-top: 34px; font-family: 'League Gothic', sans-serif; font-size: 210px; line-height: .84; color: #fff; text-transform: uppercase; }
      #l3 { font-family: 'League Gothic', sans-serif; font-size: 270px; line-height: .84; color: var(--accent); text-transform: uppercase; }
    </style>
    <div id="root" data-composition-id="claim" data-width="1920" data-height="1080">
      <div id="dim"></div>
      <div id="txt">
        <div id="l1"><span class="w" data-t=".17">When</span> <span class="w" data-t=".65">you</span> <span class="w" data-t=".81">change</span> <span class="w" data-t="1.05">the</span> <span class="w" data-t="1.21">way</span> <span class="w" data-t="1.33">you</span> <span class="w" data-t="1.45">see</span> <span class="w" data-t="1.63">yourself,</span></div>
        <div id="l2"><span class="w g" data-t="2.11">The</span> <span class="w g" data-t="2.19">world</span> <span class="w g" data-t="2.39">around</span> <span class="w g" data-t="2.73">you</span></div>
        <div id="l3"><span class="w g" data-t="2.97">changes.</span></div>
      </div>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo('#dim', { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.inOut' }, 0);
        document.querySelectorAll('#txt .w').forEach((w) => {
          const t = parseFloat(w.dataset.t);
          if (w.classList.contains('g')) {
            tl.fromTo(w, { opacity: 0, scale: 1.3, filter: 'blur(12px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.22, ease: 'expo.out' }, t);
          } else {
            tl.fromTo(w, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, ease: 'power2.out' }, t);
          }
        });
        window.__timelines['claim'] = tl;
      })();
    </script>
  </template>
</html>
